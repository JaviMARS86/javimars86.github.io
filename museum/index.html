<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museo de Javi</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{ --deep:#0D1938; --navy:#14254D; --gold:#E8B44A; --chalk:#EFE8D8; --mute:#A9B3C9; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--deep);color:var(--chalk);overflow:hidden;
  font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
canvas#c.drag{cursor:grabbing} canvas#c.point{cursor:pointer}
a{color:inherit}
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:max(12px,env(safe-area-inset-top)) 16px 12px;z-index:3;pointer-events:none;
  background:linear-gradient(rgba(13,25,56,.9),rgba(13,25,56,0))}
.top > *{pointer-events:auto}
.brand{font-family:'Fraunces',serif;font-weight:600;font-size:20px;white-space:nowrap}
.brand em{font-style:italic;color:var(--gold);font-weight:500}
.rooms{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rooms button{flex:none;font:500 13px 'Bricolage Grotesque',sans-serif;color:var(--mute);background:rgba(20,37,77,.7);
  border:1px solid rgba(239,232,216,.16);border-radius:999px;padding:7px 12px;cursor:pointer}
.rooms button:hover{color:var(--chalk);border-color:rgba(232,180,74,.6)}
.rooms button[aria-current="true"]{color:var(--deep);background:var(--gold);border-color:var(--gold)}
.rooms button:focus-visible,.back:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.back{font-family:'JetBrains Mono',monospace;font-size:12px;text-decoration:none;color:var(--mute);white-space:nowrap;
  border:1px solid rgba(239,232,216,.2);padding:7px 11px;border-radius:999px}
.back:hover{color:var(--chalk);border-color:var(--gold)}
#map{position:fixed;right:16px;top:64px;z-index:3;width:150px;height:150px;border-radius:14px;cursor:pointer;
  background:rgba(13,25,56,.82);border:1px solid rgba(232,180,74,.25)}
.panel{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(680px,calc(100% - 32px));z-index:3;display:flex;gap:10px;align-items:flex-start;
  background:rgba(13,25,56,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(232,180,74,.28);border-radius:16px;padding:13px 14px 14px 18px}
.info{flex:1;min-width:0}
.kick{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.info h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.2;margin:3px 0}
.info p{font-size:14.5px;line-height:1.42;color:#D9D3C4}
.info a.more{display:inline-block;margin-top:6px;font-size:13.5px;color:var(--gold)}
.info a.more[hidden]{display:none}
.x{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid rgba(239,232,216,.2);background:var(--navy);
  color:var(--chalk);font-size:17px;cursor:pointer;display:none}
.x.on{display:block}
#load{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--deep);transition:opacity .7s}
#load.done{opacity:0;pointer-events:none}
#load .box{text-align:center;width:min(380px,84vw)}
#load h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,6vw,46px)}
#load h1 em{color:var(--gold);font-weight:500}
#load p{color:var(--mute);margin:8px 0 22px;font-size:15px;line-height:1.45}
.bar{height:3px;background:rgba(239,232,216,.15);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#enter{margin-top:22px;font:600 15px 'Bricolage Grotesque',sans-serif;color:var(--deep);background:var(--gold);
  border:0;border-radius:999px;padding:12px 26px;cursor:pointer;opacity:.35;pointer-events:none;transition:opacity .3s}
#enter.ready{opacity:1;pointer-events:auto}
#nogl{display:none;margin-top:16px}
@media (max-width:640px){
  .brand{font-size:17px} .rooms{order:3;flex-basis:100%} .rooms button{font-size:12.5px;padding:6px 10px}
  #map{width:104px;height:104px;top:104px;right:12px}
  .info h2{font-size:17px}.info p{font-size:13.5px}
  .panel{padding:11px 10px 12px 14px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="A 3D museum with a lobby and four rooms. Click the floor to walk, click a piece to look closer."></canvas>

<div class="top">
  <div class="brand">Museo <em>de Javi</em></div>
  <nav class="rooms" id="rooms" aria-label="Rooms"></nav>
  <a class="back" href="../">&larr; site</a>
</div>
<canvas id="map" width="300" height="300" aria-label="Map of the museum. Click to walk there."></canvas>

<div class="panel" role="region" aria-label="What you're looking at">
  <div class="info" aria-live="polite">
    <div class="kick" id="kick">Lobby</div>
    <h2 id="title">Museo de Javi</h2>
    <p id="cap"></p>
    <a class="more" id="more" href="#" target="_blank" rel="noopener" hidden></a>
  </div>
  <button class="x" id="close" aria-label="Stop looking at this piece">&times;</button>
</div>

<div id="load">
  <div class="box">
    <h1>Museo <em>de Javi</em></h1>
    <p>Four rooms: me, my work, Apollo and my projects. Click anywhere on the floor to walk there.</p>
    <div class="bar"><i id="barfill"></i></div>
    <button id="enter">Enter the museum</button>
    <p id="nogl">Your browser can't run WebGL, so the museum won't open here. <a href="../">Back to the site</a>.</p>
  </div>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* =========================================================
   PLAN  (metres; north is -z)
   Lobby in the middle, one room on each side.
   ========================================================= */
const H = 6, T = .3, DOOR_W = 3.2, DOOR_H = 3.8, EYE = 1.62;
const ROOMS = {
  lobby:    { name:'Lobby',    kick:'Start here', x0:-7,  x1:7,  z0:-7,  z1:7,
              text:'Four rooms, one topic each. Click anywhere on the floor to walk there, or click a piece to look closer.',
              entry:[0,3.5], look:[0,1.9,-7] },
  me:       { name:'Me',       kick:'Room I',     x0:-7,  x1:7,  z0:7,   z1:23, door:[0,7,'x'],
              text:'What I like, and the things I make with my hands.', entry:[0,9.6], look:[0,2.2,23] },
  work:     { name:'Work',     kick:'Room II',    x0:-23, x1:-7, z0:-7,  z1:7,  door:[-7,0,'z'],
              text:'Where I’ve worked, from robot tooling in Michigan to running a media lab in Rochester.', entry:[-9.6,0], look:[-23,2.2,0] },
  apollo:   { name:'Apollo',   kick:'Room III',   x0:-7,  x1:7,  z0:-23, z1:-7, door:[0,-7,'x'],
              text:'Plush dog, frequent flyer, our son. Every photo in here has him in it somewhere.', entry:[0,-9.4], look:[0,1.6,-15] },
  projects: { name:'Projects', kick:'Room IV',    x0:7,   x1:23, z0:-7,  z1:7,  door:[7,0,'z'],
              text:'Things I’ve built, or am building right now.', entry:[9.6,0], look:[23,2.2,0] },
};
const ORDER = ['lobby','me','work','apollo','projects'];
const OBST = [];   // {x,z,r} things you walk around (pedestals, props)

/* aspect ratios of every image (width / height) */
const A = {"ex/adoption-day":.75,"ex/andorra":1.509,"ex/astorga-gate":1.509,"ex/astorga-palace":1.509,"ex/basilica-selfie":1.509,"ex/beach":1.509,"ex/bedtime":1.778,"ex/build-balloon":.753,"ex/build-porsche":.75,"ex/build-ship":2.162,"ex/build-spiderman":.75,"ex/build-walle-eve":1.778,"ex/cangas-bridge":1.509,"ex/chocolate":.662,"ex/covadonga-lake":1.509,"ex/covadonga-lion":1.509,"ex/irene-lake":1.509,"ex/javi-covadonga":1.509,"ex/madrid-alcala":1.509,"ex/nap":1.509,"ex/paris-apollo-statue":.662,"ex/paris-boat":.662,"ex/paris-eiffel":.662,"ex/paris-mona":.662,"ex/paris-view":1.509,"ex/retiro":1.509,"ex/santiago":1.509,"ex/straw-hat":1.778,"ex/tree":1.509,"ex/vr":.562,"../images/eclipse-3-totality-close":1.51,"../images/eclipse-5-town-lights":1.328,"../images/eclipse-6-diamond-ring":1.51,"../images/church-through-leaves":1.509,"../images/painting-space":.75,"../images/build-galaxy":1.333};

/* =========================================================
   RENDERER
   ========================================================= */
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true }); }
catch(e){ document.getElementById('nogl').style.display='block'; document.querySelector('#load .bar').style.display='none'; document.getElementById('enter').style.display='none'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070e24);
const camera = new THREE.PerspectiveCamera(62, 1, .05, 120);

const manager = new THREE.LoadingManager();
const barfill = document.getElementById('barfill');
manager.onProgress = (u, l, t) => { barfill.style.width = (100*l/t).toFixed(0)+'%'; };
const loader = new THREE.TextureLoader(manager);
const tex = (url, color=true) => { const t = loader.load(url); if (color) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };

if (document.fonts) await Promise.race([
  Promise.all(['600 40px Fraunces','400 28px "Bricolage Grotesque"','600 22px "JetBrains Mono"'].map(f => document.fonts.load(f))),
  new Promise(r => setTimeout(r, 2500)) ]).catch(()=>{});

/* =========================================================
   MATERIALS & CANVAS HELPERS
   ========================================================= */
function canvasTex(w, h, draw){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function wrap(g, text, x, y, maxW, lh){
  let line = '', yy = y;
  for (const w of text.split(' ')){ const test = line ? line+' '+w : w;
    if (g.measureText(test).width > maxW && line){ g.fillText(line, x, yy); line = w; yy += lh; } else line = test; }
  if (line) g.fillText(line, x, yy); return yy;
}
function woodTex(){ const t = canvasTex(512, 512, (g,w,h)=>{
  g.fillStyle='#3a2716'; g.fillRect(0,0,w,h);
  for (let r=0;r<8;r++) for (let c=0;c<2;c++){ const off=(r%2)*128, s=46+Math.random()*22;
    g.fillStyle=`rgb(${s+30},${s+8},${s-14})`; g.fillRect((c*256+off)%512, r*64, 254, 62);
    g.fillStyle='rgba(0,0,0,.08)'; for(let i=0;i<14;i++) g.fillRect((c*256+off)%512, r*64+Math.random()*62, 254, 1); } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
function stoneTex(){ const t = canvasTex(512, 512, (g,w,h)=>{
  for (let r=0;r<4;r++) for (let c=0;c<4;c++){ const s = 196+Math.random()*16;
    g.fillStyle=`rgb(${s},${s-6},${s-16})`; g.fillRect(c*128, r*128, 126, 126);
    for (let i=0;i<40;i++){ g.fillStyle=`rgba(120,110,95,${Math.random()*.08})`; g.beginPath();
      g.ellipse(c*128+Math.random()*128, r*128+Math.random()*128, Math.random()*30, Math.random()*4, Math.random()*3, 0, 7); g.fill(); } }
  g.fillStyle='#8f8576'; for (let i=0;i<=4;i++){ g.fillRect(i*128-1,0,2,h); g.fillRect(0,i*128-1,w,2); } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }

const wallMat  = new THREE.MeshStandardMaterial({ color:0x18295a, roughness:.92 });
const trimMat  = new THREE.MeshStandardMaterial({ color:0xE8B44A, roughness:.35, metalness:.6 });
const frameMat = new THREE.MeshStandardMaterial({ color:0x1b1410, roughness:.5, metalness:.2 });
const plinthMat= new THREE.MeshStandardMaterial({ color:0xEFE8D8, roughness:.6 });
const darkMat  = new THREE.MeshStandardMaterial({ color:0x15171c, roughness:.55, metalness:.3 });

const world = new THREE.Group(); scene.add(world);
const floors = [], blockers = [], clickables = [], exhibits = [], updaters = [];

/* =========================================================
   ARCHITECTURE
   ========================================================= */
function box(w, h, d, x, y, z, mat=wallMat){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); world.add(m); return m; }
// wall along x (z fixed) or along z (x fixed); optional door gap centred at `door`
function wall(axis, fixed, a, b, door){
  const segs = door == null ? [[a,b]] : [[a, door-DOOR_W/2], [door+DOOR_W/2, b]];
  for (const [s,e] of segs){ const len = e-s+T, mid = (s+e)/2;
    const m = axis==='x' ? box(len, H, T, mid, H/2, fixed) : box(T, H, len, fixed, H/2, mid); blockers.push(m); }
  if (door != null){
    const lw = DOOR_W+T, lh = H-DOOR_H, m = axis==='x' ? box(lw, lh, T, door, DOOR_H+lh/2, fixed) : box(T, lh, lw, fixed, DOOR_H+lh/2, door);
    blockers.push(m);
    const trim = axis==='x' ? box(DOOR_W+.1, .06, T+.06, door, DOOR_H, fixed, trimMat) : box(T+.06, .06, DOOR_W+.1, fixed, DOOR_H, door, trimMat);
  }
}
function roomShell(key, floorTexFn, repeat){
  const r = ROOMS[key], w = r.x1-r.x0, d = r.z1-r.z0, cx = (r.x0+r.x1)/2, cz = (r.z0+r.z1)/2;
  const ft = floorTexFn(); ft.repeat.set(...repeat);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ map:ft, roughness:.7 }));
  floor.rotation.x = -Math.PI/2; floor.position.set(cx, 0, cz); floor.userData.room = key; world.add(floor); floors.push(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color:0x0b1533, roughness:1 }));
  ceil.rotation.x = Math.PI/2; ceil.position.set(cx, H, cz); world.add(ceil);
  // a soft skylight panel
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(w*.55, d*.55), new THREE.MeshBasicMaterial({ color:0x3a4a7a }));
  sky.rotation.x = Math.PI/2; sky.position.set(cx, H-.01, cz); world.add(sky);
  // skirting + picture rail on the 4 walls
  for (const [ax, fx, a, b] of [['x',r.z0,r.x0,r.x1],['x',r.z1,r.x0,r.x1],['z',r.x0,r.z0,r.z1],['z',r.x1,r.z0,r.z1]]){
    const len = b-a, mid = (a+b)/2, inset = fx === r.z0 || fx === r.x0 ? T/2+.02 : -(T/2+.02);
    for (const [hh, yy] of [[.14,.07],[.035,4.95]]){
      if (ax==='x') box(len, hh, .04, mid, yy, fx+inset, trimMat); else box(.04, hh, len, fx+inset, yy, mid, trimMat);
    }
  }
  const L1 = new THREE.PointLight(0xffe4b8, 16, 22, 1.3); L1.position.set(cx, H-.6, cz); world.add(L1);
}
roomShell('lobby', stoneTex, [3.5,3.5]);
for (const k of ['me','work','apollo','projects']) roomShell(k, woodTex, k==='work'||k==='projects' ? [8,7] : [7,8]);
scene.add(new THREE.HemisphereLight(0xc4ceff, 0x3a2a18, 1.0));
// lobby walls (each has a door) …
wall('x', -7, -7, 7, 0);  wall('x', 7, -7, 7, 0);  wall('z', -7, -7, 7, 0);  wall('z', 7, -7, 7, 0);
// … and the outer walls of each room
wall('x', -23, -7, 7); wall('z', -7, -23, -7); wall('z', 7, -23, -7);          // apollo
wall('x', 23, -7, 7);  wall('z', -7, 7, 23);   wall('z', 7, 7, 23);            // me
wall('z', -23, -7, 7); wall('x', -7, -23, -7); wall('x', 7, -23, -7);          // work
wall('z', 23, -7, 7);  wall('x', -7, 7, 23);   wall('x', 7, 7, 23);            // projects

/* interior wall frame: origin, tangent (left→right as you face the wall), inward normal */
function wf(key, side){
  const r = ROOMS[key], s = T/2;
  if (side==='N') return { o:new THREE.Vector3(r.x0,0,r.z0+s), t:new THREE.Vector3(1,0,0),  n:new THREE.Vector3(0,0,1),  len:r.x1-r.x0, key };
  if (side==='S') return { o:new THREE.Vector3(r.x1,0,r.z1-s), t:new THREE.Vector3(-1,0,0), n:new THREE.Vector3(0,0,-1), len:r.x1-r.x0, key };
  if (side==='E') return { o:new THREE.Vector3(r.x1-s,0,r.z0), t:new THREE.Vector3(0,0,1),  n:new THREE.Vector3(-1,0,0), len:r.z1-r.z0, key };
  /* W */         return { o:new THREE.Vector3(r.x0+s,0,r.z1), t:new THREE.Vector3(0,0,-1), n:new THREE.Vector3(1,0,0),  len:r.z1-r.z0, key };
}
const onWall = (W, t, y, off=0) => W.o.clone().addScaledVector(W.t, t).addScaledVector(W.n, off).setY(y);
const faceRot = n => Math.atan2(n.x, n.z);

/* =========================================================
   EXHIBIT PIECES
   ========================================================= */
// Depth photo: the photo is pushed out by its depth map, but only when you look at it from the front.
// From the side it eases back to a flat print, so nothing stretches.
const depthVS = `
uniform sampler2D dmap; uniform float amt; varying vec2 vUv;
void main(){
  vUv = uv;
  vec3 n = normalize(mat3(modelMatrix) * vec3(0.,0.,1.));
  vec3 c = (modelMatrix * vec4(0.,0.,0.,1.)).xyz;
  float facing = dot(normalize(cameraPosition - c), n);
  float f = smoothstep(.70, .95, facing);
  float e = smoothstep(0.,.05,uv.x)*smoothstep(1.,.95,uv.x)*smoothstep(0.,.05,uv.y)*smoothstep(1.,.95,uv.y);
  vec3 p = position; p.z += texture2D(dmap, uv).r * amt * e * f;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.);
}`;
const depthFS = `
uniform sampler2D map; uniform float glow; varying vec2 vUv;
void main(){ vec4 c = texture2D(map, vUv); gl_FragColor = linearToOutputTexel(vec4(c.rgb*(1.0+glow), 1.)); }`;
function photoMesh(src, w, h, depth){
  const map = tex(src+'.jpg');
  if (!depth) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.ShaderMaterial({
      uniforms:{ map:{value:map}, glow:{value:0} }, vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`, fragmentShader:depthFS })); return m; }
  const dmap = tex(src+'-d.jpg', false);
  const sx = 96, sy = Math.max(32, Math.round(96*h/w));
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h, sx, sy), new THREE.ShaderMaterial({
    uniforms:{ map:{value:map}, dmap:{value:dmap}, amt:{value:depth*Math.min(w,h)}, glow:{value:0} }, vertexShader:depthVS, fragmentShader:depthFS }));
}
function frameAround(inner, w, h){
  const g = new THREE.Group();
  const back = new THREE.Mesh(new THREE.BoxGeometry(w+.22, h+.22, .08), frameMat); back.position.z = -.05; g.add(back);
  for (const [sx,sy,px,py] of [[w+.26,.06,0,h/2+.12],[w+.26,.06,0,-h/2-.12],[.06,h+.26,w/2+.12,0],[.06,h+.26,-w/2-.12,0]]){
    const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, .1), trimMat); b.position.set(px,py,0); g.add(b); }
  g.add(inner); inner.position.z = .012; return g;
}
// soft picture light painted ON the wall, behind the frame
const glowTex = canvasTex(256, 256, (g,w,h)=>{ const r = g.createRadialGradient(w/2,h*.12,4,w/2,h*.45,h*.62);
  r.addColorStop(0,'rgba(255,236,200,.5)'); r.addColorStop(.5,'rgba(255,226,180,.14)'); r.addColorStop(1,'rgba(255,220,170,0)'); g.fillStyle=r; g.fillRect(0,0,w,h); });
const glowMat = new THREE.MeshBasicMaterial({ map:glowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
function wallGlow(W, t, y, w, h){ const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glowMat);
  m.position.copy(onWall(W, t, y, .004)); m.rotation.y = faceRot(W.n); world.add(m); }

function placard(title, text, kicker){
  const t = canvasTex(640, 400, (g,w,h)=>{
    g.fillStyle='#EFE8D8'; g.fillRect(0,0,w,h); g.fillStyle='#E8B44A'; g.fillRect(0,0,10,h);
    g.fillStyle='#8a6a2a'; g.font='600 22px "JetBrains Mono", monospace'; g.fillText(kicker||'', 44, 58);
    g.fillStyle='#0D1938'; g.font='600 44px Fraunces, Georgia, serif'; const y = wrap(g, title, 44, 116, w-80, 50);

// a reading panel (room intros, jobs, favourites)
function textPanel(w, h, { kicker='', title='', body='', dark=false }){
  const S = 360, pw = Math.round(w*S), ph = Math.round(h*S);
  const t = canvasTex(pw, ph, (g)=>{
    // shrink the type until everything fits on the panel
    let k = 1; const pad = .2*S;
    const lay = (draw) => {
      const tf = THREE.MathUtils.clamp(.085*w, .2, .3)*S*k, bf = THREE.MathUtils.clamp(.044*w, .11, .15)*S*k, kf = .085*S*Math.min(1,k*1.05);
      let y = pad + kf;
      g.font = `600 ${kf}px "JetBrains Mono", monospace`; g.fillStyle = dark ? '#E8B44A' : '#8a6a2a'; if (draw) g.fillText(kicker.toUpperCase(), pad, y);
      g.font = `600 ${tf}px Fraunces, Georgia, serif`; g.fillStyle = dark ? '#EFE8D8' : '#0D1938';
      y = draw ? wrap(g, title, pad, y + tf*1.25, pw-2*pad, tf*1.12) : measure(title, y + tf*1.25, tf*1.12);
      g.font = `400 ${bf}px "Bricolage Grotesque", system-ui, sans-serif`; g.fillStyle = dark ? '#C9CFDE' : '#2c3655';
      y = draw ? wrap(g, body, pad, y + bf*1.7, pw-2*pad, bf*1.38) : measure(body, y + bf*1.7, bf*1.38);
      return y; };
    const measure = (text, y, lh) => { let line = '', yy = y; for (const wd of text.split(' ')){ const tt = line ? line+' '+wd : wd; if (g.measureText(tt).width > pw-2*pad && line){ line = wd; yy += lh; } else line = tt; } return yy; };
    while (k > .5 && lay(false) > ph - pad*.8) k *= .93;
    g.fillStyle = dark ? '#0f1d44' : '#EFE8D8'; g.fillRect(0,0,pw,ph);
    g.fillStyle = '#E8B44A'; g.fillRect(0,0,pw,.035*S);

  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map:t, color:0xe2ddd0 }));

/* lay several photos in a row, evenly spaced between t0 and t1 */
function row(W, y, t0, t1, items){
  const ws = items.map(it => { const a = A[it.src]; return it.w ?? (it.h ? it.h*a : (a >= 1 ? 2.4 : 1.9*a)); });
  const gap = ((t1-t0) - ws.reduce((s,v)=>s+v,0)) / (items.length+1);
  let t = t0 + gap; items.forEach((it,i) => { hang(W, t + ws[i]/2, y, it); t += ws[i] + gap; });
}

/* a screen that loops videos (or shows a placeholder until the footage exists) */
const tvs = [];
function screen(W, t, y, h, aspect, { sources, poster, placeholder }){
  const w = h*aspect;
  const mat = new THREE.MeshBasicMaterial({ toneMapped:false, map: placeholder || tex(poster) });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  const g = frameAround(m, w, h); g.position.copy(onWall(W, t, y, .06)); g.rotation.y = faceRot(W.n); world.add(g);
  wallGlow(W, t, y + h*.15, w + 1.6, h + 2);
  if (sources){
    const v = document.createElement('video'); Object.assign(v, { muted:true, playsInline:true, preload:'metadata' }); v.setAttribute('playsinline','');
    const ext = v.canPlayType('video/mp4; codecs="avc1.42E01E"') ? '.mp4' : '.webm';
    let i = 0; v.src = sources[0] + ext;
    v.addEventListener('ended', () => { i = (i+1) % sources.length; v.src = sources[i] + ext; v.play().catch(()=>{}); });
    const vt = new THREE.VideoTexture(v); vt.colorSpace = THREE.SRGBColorSpace;
    v.addEventListener('playing', () => { if (mat.map !== vt){ mat.map = vt; mat.needsUpdate = true; } });
    tvs.push({ v, pos:onWall(W, t, y, 0), room:W.key });
  }
  return { mesh:m, w, h };
}

/* =========================================================
   WALKING
   ========================================================= */
function roomOf(x, z){
  for (const k of ['me','work','apollo','projects','lobby']){ const r = ROOMS[k]; if (x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1) return k; }
  return null;
}
const MARGIN = .55;
function clampInRoom(p, k){ const r = ROOMS[k];
  p.x = THREE.MathUtils.clamp(p.x, r.x0+MARGIN, r.x1-MARGIN); p.z = THREE.MathUtils.clamp(p.z, r.z0+MARGIN, r.z1-MARGIN);
  for (const o of OBST){ const dx = p.x-o.x, dz = p.z-o.z, d = Math.hypot(dx,dz), m = o.r+.45; if (d < m){ const s = (d||1e-3); p.x = o.x + dx/s*m; p.z = o.z + dz/s*m; } }
  return p; }
function walkable(x, z){
  for (const o of OBST) if (Math.hypot(x-o.x, z-o.z) < o.r+.35) return false;
  for (const k of ORDER){ const r = ROOMS[k]; if (x > r.x0+.4 && x < r.x1-.4 && z > r.z0+.4 && z < r.z1-.4) return true; }
  for (const k of ['me','work','apollo','projects']){ const [dx,dz,ax] = ROOMS[k].door;
    if (ax==='x' ? (Math.abs(x-dx) < DOOR_W/2-.4 && Math.abs(z-dz) < .8) : (Math.abs(z-dz) < DOOR_W/2-.4 && Math.abs(x-dx) < .8)) return true; }
  return false;
}
function doorPt(k){ const [x,z] = ROOMS[k].door; return new THREE.Vector3(x, EYE, z); }
function detour(a, b, out){
  for (const o of OBST){
    const ab = new THREE.Vector2(b.x-a.x, b.z-a.z), L = ab.length(); if (L < .01) continue; ab.divideScalar(L);
    const ao = new THREE.Vector2(o.x-a.x, o.z-a.z), s = THREE.MathUtils.clamp(ao.dot(ab), 0, L);
    const cx = a.x + ab.x*s, cz = a.z + ab.y*s, d = Math.hypot(o.x-cx, o.z-cz), need = o.r + .6;
    if (d < need && s > .2 && s < L-.2){ let px = cx-o.x, pz = cz-o.z; const pl = Math.hypot(px,pz); if (pl < 1e-3){ px = -ab.y; pz = ab.x; } else { px/=pl; pz/=pl; }
      out.push(new THREE.Vector3(o.x + px*(need+.3), EYE, o.z + pz*(need+.3))); return; }
  }
}
function route(a, b){
  const ra = roomOf(a.x, a.z) || 'lobby', rb = roomOf(b.x, b.z) || 'lobby', pts = [a.clone()];
  const legs = [];
  if (ra !== rb){ if (ra !== 'lobby') legs.push(doorPt(ra)); if (rb !== 'lobby') legs.push(doorPt(rb)); }
  legs.push(b.clone());
  for (const p of legs){ detour(pts[pts.length-1], p, pts); pts.push(p); }
  return pts;
}

const cam = { pos:new THREE.Vector3(...[ROOMS.lobby.entry[0], EYE, ROOMS.lobby.entry[1]]), yaw:0, pitch:0 };
let move = null, focus = null;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const angTo = (from, to) => { let d = to - from; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return from + d; };
function lookAngles(from, at){ const d = new THREE.Vector3().subVectors(at, from); return { yaw:Math.atan2(d.x, -d.z), pitch:Math.atan2(d.y, Math.hypot(d.x, d.z)) }; }
function walkTo(target, look, onArrive){
  const pts = route(cam.pos, target);
  const segL = []; let L = 0; for (let i=1;i<pts.length;i++){ const l = pts[i].distanceTo(pts[i-1]); segL.push(l); L += l; }
  let toYaw = null, toPitch = null;
  if (look){ const a = lookAngles(target, look); toYaw = angTo(cam.yaw, a.yaw); toPitch = a.pitch; }
  move = { pts, segL, L, t:0, dur: Math.min(5, .45 + L/3.6), fromYaw:cam.yaw, fromPitch:cam.pitch, toYaw, toPitch, onArrive };
}
function pointAt(s){ let acc = 0; for (let i=0;i<move.segL.length;i++){ if (acc + move.segL[i] >= s || i === move.segL.length-1){ const k = move.segL[i] ? (s-acc)/move.segL[i] : 1; return new THREE.Vector3().lerpVectors(move.pts[i], move.pts[i+1], THREE.MathUtils.clamp(k,0,1)); } acc += move.segL[i]; } return move.pts.at(-1).clone(); }

function standFor(ex){
  if (ex.track) return new THREE.Vector3(13.2, EYE, 3.0);   // a spot to watch the drone from
  // stand far enough back that the whole piece fits on this screen (phones are narrow)
  const vt = Math.tan(THREE.MathUtils.degToRad(camera.fov)/2), ht = vt*camera.aspect;
  const fit = Math.max((ex.w/2 + .35)/ht, (ex.h/2 + .35)/vt) + .1;
  const dist = ex.dist ? Math.max(ex.dist, ex.dist*(camera.aspect < .8 ? 1.25 : 1)) : THREE.MathUtils.clamp(fit, 2.0, 6.5);
  const p = ex.center.clone().addScaledVector(ex.normal, dist); p.y = EYE;
  return clampInRoom(p, ex.room);
}
function visit(ex){
  setFocus(ex);
  walkTo(standFor(ex), ex.center);
}
function goRoom(k){ const r = ROOMS[k]; setFocus(null); walkTo(clampInRoom(new THREE.Vector3(r.entry[0], EYE, r.entry[1]), k), new THREE.Vector3(...r.look)); }

  if (down && !down.moved){ const p = pick(e.clientX, e.clientY);
    if (p?.ex) visit(p.ex);
    else if (p?.floor){ setFocus(null); walkTo(clampInRoom(new THREE.Vector3(p.floor.x, EYE, p.floor.z), p.room)); } }
  down = null;
});
canvas.addEventListener('pointerleave', () => { mouse = null; });
const keys = new Set();
addEventListener('keydown', e => { if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)){ keys.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow')) e.preventDefault(); }
  if (e.key === 'Escape') setFocus(null); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
let videoKicked = false;
function kickVideo(){ if (videoKicked) return; videoKicked = true; for (const t of tvs) t.v.play().then(()=>{ if (curRoom !== t.room) t.v.pause(); }).catch(()=>{ videoKicked = false; }); }

/* =========================================================
   LOOP
   ========================================================= */
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight;
  camera.fov = camera.aspect < .8 ? 74 : 62; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock(), fwd = new THREE.Vector3(), side = new THREE.Vector3(), look = new THREE.Vector3();
let mapTick = 0;
function frame(){
  const raw = clock.getDelta(), dt = Math.min(raw, .05), t = clock.elapsedTime, mdt = Math.min(raw, .5);
  for (const u of updaters) u(t, dt);
  // walking along a route
  if (move){ move.t += mdt/move.dur; const k = ease(Math.min(1, move.t));
    cam.pos.copy(pointAt(k*move.L));
    if (move.toYaw !== null){ cam.yaw = move.fromYaw + (move.toYaw - move.fromYaw)*k; cam.pitch = move.fromPitch + (move.toPitch - move.fromPitch)*k; }
    if (move.t >= 1){ const cb = move.onArrive; move = null; cb && cb(); } }
  // keyboard walking
  if (keys.size){ move = null;
    const sp = 3.2*Math.min(raw,.15), turn = 1.8*Math.min(raw,.15);
    if (keys.has('arrowleft')) cam.yaw -= turn; if (keys.has('arrowright')) cam.yaw += turn;
    fwd.set(Math.sin(cam.yaw), 0, -Math.cos(cam.yaw)); side.set(-fwd.z, 0, fwd.x);
    const d = new THREE.Vector3();
    if (keys.has('w') || keys.has('arrowup')) d.add(fwd); if (keys.has('s') || keys.has('arrowdown')) d.sub(fwd);
    if (keys.has('d')) d.add(side); if (keys.has('a')) d.sub(side);
    if (d.lengthSq()){ d.normalize().multiplyScalar(sp); if (focus) setFocus(null);
      if (walkable(cam.pos.x + d.x, cam.pos.z + d.z)) { cam.pos.x += d.x; cam.pos.z += d.z; }
      else if (walkable(cam.pos.x + d.x, cam.pos.z)) cam.pos.x += d.x; else if (walkable(cam.pos.x, cam.pos.z + d.z)) cam.pos.z += d.z; } }
  // keep looking at the drone while you're watching it
  if (focus?.track && !down?.moved && !move){ const a = lookAngles(cam.pos, focus.center); cam.yaw = angTo(cam.yaw, cam.yaw + (angTo(cam.yaw, a.yaw) - cam.yaw)*.08); cam.pitch += (a.pitch - cam.pitch)*.08; }
  // tiny head movement while looking at a photo, so the depth reads
  const head = new THREE.Vector3();
  if (focus && !move && !focus.track){ const tg = new THREE.Vector3(focus.normal.z, 0, -focus.normal.x);
    head.addScaledVector(tg, Math.sin(t*.7)*.06 + (mouse ? (mouse.x/innerWidth-.5)*.22 : 0)); head.y = mouse ? -(mouse.y/innerHeight-.5)*.1 : 0; }
  camera.position.copy(cam.pos).add(head);
  look.set(cam.pos.x + Math.sin(cam.yaw)*Math.cos(cam.pitch), cam.pos.y + Math.sin(cam.pitch), cam.pos.z - Math.cos(cam.yaw)*Math.cos(cam.pitch));
  camera.lookAt(look.add(head));
  // which room am I in?
  const rk = roomOf(cam.pos.x, cam.pos.z); if (rk && rk !== curRoom){ curRoom = rk; markRoom(rk); if (!focus) showRoom(rk);
    for (const tv of tvs){ if (!videoKicked) continue; tv.room === rk ? tv.v.play().catch(()=>{}) : tv.v.pause(); } }
  // hover: highlight pieces, show the walk ring on the floor
  if (mouse && !down?.moved){ const p = pick(mouse.x, mouse.y);
    const ex = p?.ex || null;
    if (hoverEx !== ex){ if (hoverEx?.obj.material?.uniforms && hoverEx !== focus) hoverEx.obj.material.uniforms.glow.value = 0; hoverEx = ex; }
    if (ex?.obj.material?.uniforms) ex.obj.material.uniforms.glow.value = .07;
    canvas.classList.toggle('point', !!ex);
    if (p?.floor){ const q = clampInRoom(new THREE.Vector3(p.floor.x, 0, p.floor.z), p.room); ring.position.set(q.x, .02, q.z); ringDot.position.set(q.x, .021, q.z); ring.visible = ringDot.visible = true; }
    else ring.visible = ringDot.visible = false; }
  else if (!mouse) ring.visible = ringDot.visible = false;
  ring.scale.setScalar(1 + Math.sin(t*3)*.04);
  if (++mapTick % 3 === 0) drawMap();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =========================================================
   START
   ========================================================= */
const enter = document.getElementById('enter');
manager.onLoad = () => { barfill.style.width = '100%'; enter.classList.add('ready'); };
enter.onclick = () => { document.getElementById('load').classList.add('done'); kickVideo(); };
requestAnimationFrame(frame);
window.__museum = { exhibits, cam, visit, goRoom, teleport(x, z, yaw, pitch=0){ move = null; cam.pos.set(x, EYE, z); cam.yaw = yaw; cam.pitch = pitch; },
  jumpTo(i){ const ex = exhibits[i]; setFocus(ex); const p = standFor(ex); cam.pos.copy(p); const a = lookAngles(p, ex.center); cam.yaw = a.yaw; cam.pitch = a.pitch; move = null; } };
</script>
</body>
